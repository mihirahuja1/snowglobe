# Sample workloads that exercise every state kubemapper renders.
# Apply to a throwaway cluster:  kubectl apply -f examples/demo-workloads.yaml
# Remove:                        kubectl delete -f examples/demo-workloads.yaml
---
# Healthy multi-replica service. CPU limits are set so the fill level is meaningful.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 4
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
# A pod that burns CPU so its vessel fills toward the amber zone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
---
# CrashLoopBackOff: exits non-zero immediately, so it pulses red with a rising restart count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: crasher
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 2; exit 1"]
---
# Pending forever: requests more memory than any node has, so it never schedules (dashed ghost).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          resources:
            requests: { cpu: 100m, memory: 900Gi }
