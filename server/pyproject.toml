[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowglobe-k8s"
version = "0.1.0"
description = "Real-time 3D visualizer for Kubernetes clusters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mihir Ahuja" }]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/mihirahuja1/snowglobe"

[project.scripts]
snowglobe = "snowglobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["snowglobe"]

[tool.hatch.build.targets.wheel.force-include]
"snowglobe/static" = "snowglobe/static"
